name: Apply parallel poem reader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-parallel-reader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parallel layout
        run: python tools/apply_parallel_reader.py
      - name: Commit migrated pages
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reader.js docs/reader.css docs/poems/RP-*.html GENERATION.md
          git commit -m "全作品を原詩と逐語訳の並列表記へ移行"
          git push
