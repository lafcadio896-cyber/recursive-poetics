# Updating this file triggers one immediate generation.
name: Generate recursive poem

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-poem.yml"
  schedule:
    - cron: "3 3 * * 1,3,5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: recursive-poetics-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate generator
        run: python -m py_compile scripts/generate_poem.py

      - name: Generate poem cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_poem.py

      - name: Commit generated work to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "recursive-poetics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          title="$(python - <<'PY'
          import json
          from pathlib import Path
          archive = json.loads(Path('docs/archive.json').read_text(encoding='utf-8'))
          item = archive[0]
          print(f"{item['id']} {item['title']}を追加")
          PY
          )"

          git add poems/generated docs/archive.json state/generation-state.json
          git commit -m "$title"
          git pull --rebase origin main
          git push origin HEAD:main
